<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Mahasiswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 500px;">
 
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Form Data Mahasiswa</h5>
    </div>
    <div class="card-body">
      <form id="myForm">
        <table class="table table-borderless">
          <tbody>
            <tr>
              <td><label for="nim">NIM</label></td>
              <td><input type="text" id="nim" class="form-control" placeholder="Masukkan NIM" required/></td>
            </tr>
            <tr>
              <td><label for="nama">Nama</label></td>
              <td><input type="text" id="nama" class="form-control" placeholder="Masukkan Nama" required/></td>
            </tr>
            <tr>
              <td><label for="prodi">Prodi</label></td>
              <td>
                <select id="prodi" class="form-select" required>
                  <option value="" disabled selected>-- Pilih --</option>
                  <option>Teknik Informatika</option>
                  <option>Sistem Informasi</option>
                  <option>Ilmu Komputer</option>
                </select>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="d-flex gap-2 justify-content-end">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('myForm').reset(); document.getElementById('hasil').classList.add('d-none')">Reset</button>
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>
 
  <!-- Hasil -->
  <div id="hasil" class="card shadow-sm mt-4 d-none">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Hasil Input</h5>
    </div>
    <div class="card-body">
      <table class="table table-bordered mb-0">
        <tbody>
          <tr><th>NIM</th><td id="out-nim"></td></tr>
          <tr><th>Nama</th><td id="out-nama"></td></tr>
          <tr><th>Prodi</th><td id="out-prodi"></td></tr>
        </tbody>
      </table>
    </div>
  </div>
 
</div>
 
<script>
  document.getElementById('myForm').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('out-nim').textContent   = document.getElementById('nim').value;
    document.getElementById('out-nama').textContent  = document.getElementById('nama').value;
    document.getElementById('out-prodi').textContent = document.getElementById('prodi').value;
    document.getElementById('hasil').classList.remove('d-none');
  });
</script>
</body>
</html>
